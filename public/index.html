<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Chatbot</title>
</head>
<body>
  <main class="chatbot">
    <h1>Chatbot</h1>
    <section id="chat-window" aria-live="polite">
      <p><strong>Bot:</strong> Hello! How can I help you today?</p>
    </section>
    <form id="chat-form">
      <label for="message">Message</label>
      <input id="message" name="message" type="text" placeholder="Type your message" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
